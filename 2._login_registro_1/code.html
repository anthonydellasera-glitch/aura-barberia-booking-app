<style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #F7F7F4;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .pt-safe {

<body class="bg-[#F7F7F4] font-sans text-on-surface antialiased min-h-screen selection:bg-primary/20 selection:text-primary">
<main class="flex flex-col relative w-full pt-safe pb-safe min-h-screen justify-between">
<div class="flex flex-col w-full px-margin">
<!-- Top Navigation & Branding Header -->
<header class="flex items-center justify-between w-full h-14 pt-1 mb-2">
<button aria-label="Volver" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all duration-150 border border-black/[0.04]" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<!-- Aura Barbería Branding Badge -->
<div class="flex items-center gap-2 px-3 py-1.5 bg-surface-container-lowest rounded-full border border-black/[0.04] shadow-sm">
<div class="w-5 h-5 rounded-full bg-[#1F5C46] flex items-center justify-center text-white">
<span class="material-symbols-outlined text-[13px]">content_cut</span>
</div>
<span class="font-bold text-[13px] tracking-tight text-[#1a1c1b]">AURA BARBERÍA</span>
</div>
<div class="w-10"></div> <!-- Balance spacing -->
</header>
<!-- Welcome Section -->
<section class="flex flex-col items-center text-center mt-4 mb-6">
<!-- Logo Emblem -->
<img src="https://lh3.googleusercontent.com/aida/AEtjO1WEc9DKT2pw-kiXIyJJ1ZXWdCPeTtUyLKwUCUUdQt3Va3izgzxGMFNyHHu6RbpXARNSdFnkXD_p4JuVIeStEuWNhA0jTocCRTBQDxo05l9RkPGCJOzrQMtmEDMZbOtKwOC2pKVb60JzHIhcGkpyYhPQmGouljARvYKTHtzjh-kcTHG0iS-tJ6MX9tMjwYB-BKuQ1NPYlFyivbALGhK5yjr8y4NUD7zKkxXbLVvvn0oQf4l2DOY87efEnyI" alt="Aura Barbería Logo" class="h-12 w-auto object-contain mx-auto mb-4">
<h1 class="text-[26px] font-bold leading-tight text-on-surface tracking-tight mb-2">
          Bienvenido de nuevo
        </h1>
<p class="text-[14px] leading-relaxed text-secondary max-w-[290px]">
          Ingresa tus credenciales para gestionar tus citas y beneficios exclusivos.
        </p>
</section>
<!-- Form -->
<form class="flex flex-col w-full space-y-4" id="loginForm" onsubmit="event.preventDefault();">
<!-- Input field: Correo electrónico o teléfono -->
<div class="flex flex-col space-y-1.5">
<label class="text-[13px] font-semibold text-on-surface ml-1" for="identifier">
            Correo electrónico o teléfono
          </label>
<div class="relative flex items-center w-full">
<div class="absolute left-4 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full h-[52px] pl-11 pr-4 bg-surface-container-lowest rounded-2xl text-[14px] text-on-surface placeholder:text-secondary/70 border border-black/[0.06] focus:border-[#1F5C46] focus:ring-1 focus:ring-[#1F5C46] focus:outline-none shadow-sm transition-all" id="identifier" placeholder="mateo.silva@email.com" type="text">
</div>
</div>
<!-- Input field: Contraseña -->
<div class="flex flex-col space-y-1.5">
<label class="text-[13px] font-semibold text-on-surface ml-1" for="passwordInput">
            Contraseña
          </label>
<div class="relative flex items-center w-full">
<div class="absolute left-4 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-[52px] pl-11 pr-12 bg-surface-container-lowest rounded-2xl text-[14px] text-on-surface placeholder:text-secondary/70 border border-black/[0.06] focus:border-[#1F5C46] focus:ring-1 focus:ring-[#1F5C46] focus:outline-none shadow-sm transition-all" id="passwordInput" placeholder="••••••••" type="password">
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-3.5 p-1 flex items-center justify-center text-secondary hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Row: Recordarme checkbox & ¿Olvidaste tu contraseña? link -->
<div class="flex items-center justify-between pt-1 px-1">
<label class="flex items-center space-x-2.5 cursor-pointer select-none">
<input class="w-4 h-4 rounded text-[#1F5C46] border-outline-variant focus:ring-[#1F5C46] focus:ring-offset-0 bg-surface-container-lowest cursor-pointer" id="rememberMe" type="checkbox">
<span class="text-[13px] font-medium text-on-surface">Recordarme</span>
</label>
<button class="text-[13px] font-semibold text-[#1F5C46] hover:opacity-85 transition-opacity" type="button">
            ¿Olvidaste tu contraseña?
          </button>
</div>
<!-- Primary Button -->
<div class="pt-2">
<button class="w-full h-[52px] rounded-2xl bg-[#1F5C46] text-white text-[15px] font-semibold flex items-center justify-center space-x-2 shadow-sm hover:bg-[#184a38] active:scale-[0.98] transition-all duration-150" type="submit">
<span class="">Iniciar sesión</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="relative flex items-center justify-center my-6">
<div class="w-full h-[1px] bg-black/[0.07]"></div>
<span class="absolute px-3 bg-[#F7F7F4] text-[12px] font-medium uppercase tracking-wider text-secondary">
          o continuar con
        </span>
</div>
<!-- Social Buttons -->
<div class="flex flex-col w-full space-y-3">
<!-- Google Button -->
<button class="w-full h-[50px] bg-white rounded-2xl px-4 flex items-center justify-center space-x-3 text-on-surface text-[14px] font-semibold border border-black/[0.06] shadow-sm hover:bg-surface-container-lowest active:scale-[0.99] transition-all duration-150" type="button">
<svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="">Continuar con Google</span>
</button>
<!-- Apple Button -->
<button class="w-full h-[50px] bg-white rounded-2xl px-4 flex items-center justify-center space-x-3 text-on-surface text-[14px] font-semibold border border-black/[0.06] shadow-sm hover:bg-surface-container-lowest active:scale-[0.99] transition-all duration-150" type="button">
<svg class="w-5 h-5 flex-shrink-0 fill-current" viewBox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.65-.79 1.1-1.88.98-2.97-.95.04-2.09.64-2.76 1.43-.59.68-1.11 1.78-.97 2.84 1.05.08 2.11-.53 2.75-1.3"></path>
</svg>
<span class="">Continuar con Apple</span>
</button>
</div>
</div>
<!-- Footer -->
<footer class="mt-8 mb-4 text-center px-margin">
<p class="text-[14px] text-secondary">
        ¿No tienes cuenta?
        <button class="ml-1 font-bold text-[#1F5C46] hover:underline transition-all" type="button">
          Regístrate
        </button>
</p>
</footer>
</main>
<script>
    (function() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleBtn = document.getElementById('togglePassword');
      const eyeIcon = document.getElementById('eyeIcon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    })();
  </script>


</body></html>
